name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "🔍 CI Diagnostics"
        run: |
          echo "=== Environment ==="
          echo "Python Version: $(python --version)"
          echo "Pip Version: $(pip --version)"
          echo ""
          echo "=== Project Structure (*.py files) ==="
          find src -type d -name "__pycache__" -prune \
            -o -type f -name "*.py" -print | head -20
          echo ""

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff 'black==24.10.0'

      - name: Run Ruff + Black (capture logs)
        run: |
          set +e
          echo "=== Running Ruff ===" > ${{ github.workspace }}/lint.log
          ruff check src/ tests/ >> ${{ github.workspace }}/lint.log 2>&1
          echo "$?" > ${{ github.workspace }}/ruff.exitcode
          echo "" >> ${{ github.workspace }}/lint.log
          echo "=== Running Black ===" >> ${{ github.workspace }}/lint.log
          black --check src/ tests/ >> ${{ github.workspace }}/lint.log 2>&1
          echo "$?" > ${{ github.workspace }}/black.exitcode
          set -e

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log
          retention-days: 30

      - name: Fail job if lint errors were found
        if: always()
        run: |
          set -euo pipefail
          ruff_ec="$(cat "${{ github.workspace }}/ruff.exitcode" \
            2>/dev/null || echo 0)"
          black_ec="$(cat "${{ github.workspace }}/black.exitcode" \
            2>/dev/null || echo 0)"

          # If either returned an error, fail (preserving uploaded logs).
          if [ "${ruff_ec}" -ne 0 ] || [ "${black_ec}" -ne 0 ]; then
            echo "❌ Lint failed (ruff=${ruff_ec}, black=${black_ec})."
            echo "   See lint-log artifact."
            exit 1
          fi

          # Fallback: detect errors in log if exit codes not captured.
          if grep -Eiq "^(.*: error:|Found [1-9][0-9]* errors?)" \
              "${{ github.workspace }}/lint.log"; then
            echo "❌ Possible errors detected in lint.log."
            echo "   See lint-log artifact."
            exit 1
          fi

          echo "✅ Lint passed."
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pandas-stubs types-requests pydantic

      - name: Run Mypy (capture logs)
        run: |
          set +e
          mypy src/grimperium \
            > ${{ github.workspace }}/type.log 2>&1
          echo "$?" > ${{ github.workspace }}/mypy.exitcode
          set -e

      - name: Upload type log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-log
          path: type.log
          retention-days: 30

      - name: Fail job if typecheck errors were found
        if: always()
        run: |
          set -euo pipefail
          mypy_ec="$(cat "${{ github.workspace }}/mypy.exitcode" \
            2>/dev/null || echo 0)"
          if [ "${mypy_ec}" -ne 0 ]; then
            echo "❌ Type check failed (mypy=${mypy_ec})."
            echo "   See type-log artifact."
            exit 1
          fi
          if grep -Eiq "\\berror:\\b" \
              "${{ github.workspace }}/type.log"; then
            echo "❌ Possible errors in type.log."
            echo "   See type-log artifact."
            exit 1
          fi
          echo "✅ Type check passed."

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-${{ matrix.python-version }}-${{
            hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Install rdkit for CREST PM7 tests (Python 3.11 only)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          echo "Installing rdkit for enhanced test coverage..."
          poetry run pip install rdkit || \
            echo "rdkit install failed, CREST PM7 tests skipped"

      - name: Run tests (capture logs)
        run: |
          set +e
          poetry run pytest tests/ -v --cov=src/grimperium \
            --cov-report=xml --cov-report=term-missing --tb=short \
            > ${{ github.workspace }}/test-${{ matrix.python-version }}.log 2>&1
          echo "$?" > ${{ github.workspace }}/pytest.exitcode
          set -e

      - name: Fail job if tests failed
        if: always()
        run: |
          set -euo pipefail
          pytest_ec="$(cat "${{ github.workspace }}/pytest.exitcode" \
            2>/dev/null || echo 1)"
          if [ "${pytest_ec}" -ne 0 ]; then
            echo "❌ Tests failed (pytest=${pytest_ec})."
            echo "   See test-log artifact."
            # Show last 50 lines for quick debugging
            tail -50 \
              "${{ github.workspace }}/test-${{ matrix.python-version }}.log" \
              || true
            exit 1
          fi
          echo "✅ Tests passed."

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.python-version }}
          path: test-${{ matrix.python-version }}.log
          retention-days: 30

      - name: Verify coverage.xml was generated
        if: matrix.python-version == '3.11'
        run: |
          if [ -f coverage.xml ]; then
            echo "✅ coverage.xml found ($(wc -c < coverage.xml) bytes)"
          else
            echo "❌ coverage.xml NOT found — pytest may have failed before generating it"
            ls -la *.xml 2>/dev/null || echo "No XML files in workspace root"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          name: grimperium-coverage

  # ---------------------------------------------------------------------------
  # grimperium-mini: independent CI job
  # Runs from packages/grimperium-mini/ using its own pyproject.toml.
  # Python floor is 3.11 (numpy >=2.3.2 wheel requirement).
  # Does NOT share venv or coverage with the main grimperium job.
  # ---------------------------------------------------------------------------
  mini-test:
    name: "Mini — Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/grimperium-mini
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached mini venv
        id: cached-mini-dependencies
        uses: actions/cache@v4
        with:
          path: packages/grimperium-mini/.venv
          key: >-
            mini-venv-${{ runner.os }}-${{ matrix.python-version }}-${{
            hashFiles('packages/grimperium-mini/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-mini-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run mini tests (capture logs)
        run: |
          set +e
          poetry run pytest tests/ -v \
            --cov=src/grimperium_mini \
            --cov-report=xml --cov-report=term-missing --tb=short \
            > ${{ github.workspace }}/mini-test-${{ matrix.python-version }}.log 2>&1
          echo "$?" > ${{ github.workspace }}/mini-pytest.exitcode
          set -e

      - name: Fail job if mini tests failed
        if: always()
        run: |
          set -euo pipefail
          pytest_ec="$(cat "${{ github.workspace }}/mini-pytest.exitcode" \
            2>/dev/null || echo 1)"
          if [ "${pytest_ec}" -ne 0 ]; then
            echo "❌ Mini tests failed (pytest=${pytest_ec})."
            tail -50 \
              "${{ github.workspace }}/mini-test-${{ matrix.python-version }}.log" \
              || true
            exit 1
          fi
          echo "✅ Mini tests passed."

      - name: Upload mini test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-test-log-${{ matrix.python-version }}
          path: mini-test-${{ matrix.python-version }}.log
          retention-days: 30

      - name: Upload mini coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: packages/grimperium-mini/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          name: grimperium-mini-coverage

  mini-lint:
    name: "Mini — Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/grimperium-mini

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff 'black==24.10.0'

      - name: Run Ruff + Black on mini (capture logs)
        run: |
          set +e
          echo "=== Running Ruff (mini) ===" > ${{ github.workspace }}/mini-lint.log
          ruff check src/ tests/ >> ${{ github.workspace }}/mini-lint.log 2>&1
          echo "$?" > ${{ github.workspace }}/mini-ruff.exitcode
          echo "" >> ${{ github.workspace }}/mini-lint.log
          echo "=== Running Black (mini) ===" >> ${{ github.workspace }}/mini-lint.log
          black --check src/ tests/ >> ${{ github.workspace }}/mini-lint.log 2>&1
          echo "$?" > ${{ github.workspace }}/mini-black.exitcode
          set -e

      - name: Upload mini lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-lint-log
          path: mini-lint.log
          retention-days: 30

      - name: Fail job if mini lint errors were found
        if: always()
        run: |
          set -euo pipefail
          ruff_ec="$(cat "${{ github.workspace }}/mini-ruff.exitcode" \
            2>/dev/null || echo 0)"
          black_ec="$(cat "${{ github.workspace }}/mini-black.exitcode" \
            2>/dev/null || echo 0)"
          if [ "${ruff_ec}" -ne 0 ] || [ "${black_ec}" -ne 0 ]; then
            echo "❌ Mini lint failed (ruff=${ruff_ec}, black=${black_ec})."
            echo "   See mini-lint-log artifact."
            exit 1
          fi
          echo "✅ Mini lint passed."

  mini-typecheck:
    name: "Mini — Type Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/grimperium-mini

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy + stubs
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run Mypy on mini (capture logs)
        run: |
          set +e
          mypy src/grimperium_mini \
            > ${{ github.workspace }}/mini-type.log 2>&1
          echo "$?" > ${{ github.workspace }}/mini-mypy.exitcode
          set -e

      - name: Upload mini type log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-type-log
          path: mini-type.log
          retention-days: 30

      - name: Fail job if mini typecheck errors were found
        if: always()
        run: |
          set -euo pipefail
          mypy_ec="$(cat "${{ github.workspace }}/mini-mypy.exitcode" \
            2>/dev/null || echo 0)"
          if [ "${mypy_ec}" -ne 0 ]; then
            echo "❌ Mini type check failed (mypy=${mypy_ec})."
            echo "   See mini-type-log artifact."
            exit 1
          fi
          if grep -Eiq "\\berror:\\b" \
              "${{ github.workspace }}/mini-type.log"; then
            echo "❌ Possible errors in mini-type.log."
            echo "   See mini-type-log artifact."
            exit 1
          fi
          echo "✅ Mini type check passed."

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build package
        run: poetry build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  report:
    name: "📊 CI Error Summary"
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, test, build, mini-lint, mini-typecheck, mini-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download log artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-log*"
          path: ${{ github.workspace }}/logs

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -R ${{ github.workspace }}/logs

      - name: Generate CI Report
        run: python .github/scripts/generate_ci_report.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

      - name: Upload comprehensive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-Error-Summary-Report
          path: CI_ERROR_SUMMARY.md
          retention-days: 30

      - name: Display report
        if: always()
        run: |
          echo "=========================================="
          echo "CI Error Summary Report Generated:"
          echo "=========================================="
          cat CI_ERROR_SUMMARY.md

      - name: Check for failures
        if: >-
          always() &&
          (needs.lint.result == 'failure' ||
           needs.typecheck.result == 'failure' ||
           needs.test.result == 'failure' ||
           needs.mini-lint.result == 'failure' ||
           needs.mini-typecheck.result == 'failure' ||
           needs.mini-test.result == 'failure')
        run: |
          echo "❌ CI checks failed. See report above for details."
          exit 1
