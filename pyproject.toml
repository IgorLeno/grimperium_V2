[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "grimperium"
version = "0.2.0"
description = "ML Ensemble Framework for Molecular Thermodynamic Property Prediction with Delta-Learning"
authors = ["Grimperium Team"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/grimperium/grimperium"
repository = "https://github.com/grimperium/grimperium"
documentation = "https://grimperium.readthedocs.io"
keywords = ["machine-learning", "chemistry", "thermodynamics", "delta-learning", "molecular-properties"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [
    {include = "grimperium", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
scikit-learn = ">=1.3.0"
xgboost = ">=2.0.0"
rdkit = ">=2023.9.0"
sphinx = {version = ">=7.0,<8.0", optional = true}
sphinx-rtd-theme = {version = ">=2.0,<3.0", optional = true}
sphinx-autodoc-typehints = {version = ">=1.24,<2.0", optional = true}
pdoc = {version = "^14.0.0", optional = true}
rich = {version = ">=13.0", optional = true}
questionary = {version = ">=2.0.0", optional = true}
pydantic = "^2.12.5"
matplotlib = "^3.10.8"
openpyxl = {version = ">=3.1.0", optional = true}
fastapi = {version = "^0.115.0", optional = true}
uvicorn = {version = "^0.34.0", extras = ["standard"], optional = true}
httpx = {version = "^0.28.0", optional = true}
pydantic-settings = {version = "^2.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.3.0"
mypy = "^1.5.0"
ruff = "^0.9.0"
black = "^24.0.0"
pre-commit = "^3.4.0"
tox = "^4.11.0"
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
httpx = "^0.28.0"
pydantic-settings = "^2.0"
pytest-asyncio = "^1.3.0"
grimperium-mini = {path = "packages/grimperium-mini", develop = true}

[tool.poetry.extras]
docs = ["pdoc", "sphinx", "sphinx-rtd-theme", "sphinx-autodoc-typehints"]
cli = ["rich", "questionary"]
server = ["fastapi", "uvicorn", "pydantic-settings"]
worker = ["httpx", "rich", "questionary"]
distributed = ["fastapi", "uvicorn", "httpx", "pydantic-settings", "rich"]
output = ["openpyxl"]

[tool.poetry.scripts]
grimperium = "grimperium.cli:main"
grimperium-worker = "grimperium.worker.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
    "ARG001", # unused function argument (common in stubs)
    "SIM105", # contextlib.suppress (often reduces readability)
    "SIM108", # ternary operator (sometimes reduces readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S101", "S104", "S105", "S106", "S108"]
"__init__.py" = ["F401"]
# joblib serialization (S301 = pickle/joblib load)
"src/grimperium/ml/persistence.py" = ["S301"]
"src/grimperium/cli/readme_updater.py" = ["S301"]
"src/grimperium/crest_pm7/timeout_predictor.py" = ["S301", "S324"]
# subprocess calls to CREST/MOPAC binaries (S603 = subprocess call, S607 = partial path)
"src/grimperium/crest_pm7/conformer_generator.py" = ["S603", "S607"]
"src/grimperium/crest_pm7/mopac_optimizer.py" = ["S603", "S607"]
"src/grimperium/crest_pm7/preoptimization.py" = ["S603", "S607"]
"src/grimperium/crest_pm7/validation.py" = ["S603", "S607"]
# subprocess call for pip install in preflight + non-security hash for settings cache
"src/grimperium/cli/preflight.py" = ["S603", "S607", "S324"]
# non-security hash for mol_id generation
"src/grimperium/cli/views/calc_view.py" = ["S324"]
# pseudo-random for mock/demo data only
"src/grimperium/cli/mock_data.py" = ["S311"]
# tempfile.mkstemp for work directories and atomic writes
"src/grimperium/crest_pm7/config.py" = ["S108"]
# 0.0.0.0 is intentional default for a network server
"src/grimperium/server/config.py" = ["S104"]
"src/grimperium/core/csv_utils.py" = ["S108"]
"src/grimperium/crest_pm7/batch/detail_manager.py" = ["S108"]

[tool.ruff.lint.isort]
known-first-party = ["grimperium"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async (pytest-asyncio)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/grimperium"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
