[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "grimperium-mini"
version = "0.2.0"
description = "Distilled CREST + MOPAC pipeline for biodiesel TCC calculations"
authors = ["Grimperium Team"]
license = "MIT"
readme = "README.md"
packages = [
    {include = "grimperium_mini", from = "src"},
]

[tool.poetry.dependencies]
# 3.11 floor (vs. 3.10 for the main grimperium package) is required by the
# numpy pin below.
python = "^3.11"
rich = ">=13.0"
rdkit = ">=2023.9.0"
# Pinned explicitly (transitive via rdkit): numpy <2.3 has no published cp314
# wheel, which forces a from-source build that fails without python3-devel.
numpy = ">=2.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
mypy = "^1.5.0"
ruff = "^0.9.0"
black = "^24.0.0"

[tool.poetry.scripts]
grimperium-mini = "grimperium_mini.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
    "ARG001", # unused function argument (common in stubs)
    "SIM105", # contextlib.suppress (often reduces readability)
    "SIM108", # ternary operator (sometimes reduces readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S101", "S104", "S105", "S106", "S108"]
"__init__.py" = ["F401"]
# subprocess calls to CREST/MOPAC/xTB binaries (S603 = subprocess call, S607 = partial path)
"src/grimperium_mini/crest.py" = ["S603", "S607"]
"src/grimperium_mini/mopac.py" = ["S603", "S607"]
"src/grimperium_mini/xtb.py" = ["S603", "S607"]
# defusedxml not used for trusted, locally-generated xlsx XML parts
"src/grimperium_mini/io.py" = ["S314"]

[tool.ruff.lint.isort]
known-first-party = ["grimperium_mini"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.coverage.run]
source = ["src/grimperium_mini"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
